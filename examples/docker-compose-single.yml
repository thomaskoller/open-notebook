# The "single" image bundles SurrealDB, the API, the Celery worker and the
# frontend in one container - but NOT Redis, which Celery needs as its broker.
# Since v1.15 this compose file therefore runs two containers. Point
# REDIS_URL at an existing Redis instead if you already operate one.
services:
  redis:
    image: redis:8-alpine
    # Celery broker + result backend. Persistence off on purpose: job state of
    # record lives in SurrealDB, so a Redis restart loses at most the in-flight
    # queue, never user data.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    pull_policy: always

  open_notebook_single:
    # image: lfnovo/open_notebook:v1-latest-single
    build:
      context: .
      dockerfile: Dockerfile
      target: single
    ports:
      - "8502:8502"  # Next.js Frontend
      - "5055:5055"  # REST API
    env_file:
      - ./docker.env
    environment:
      # Override for single-container mode: SurrealDB runs on localhost inside the same container
      - SURREAL_URL=ws://localhost:8000/rpc
      # Redis runs as its own service (see note at the top of this file)
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./notebook_data:/app/data          # Application data
      - ./surreal_single_data:/mydata      # SurrealDB data
    restart: always
    # This container includes SurrealDB, API, Celery worker and the Next.js frontend
    # Access:
    # - Next.js UI: http://localhost:8502
    # - REST API: http://localhost:5055
    # - API Documentation: http://localhost:5055/docs